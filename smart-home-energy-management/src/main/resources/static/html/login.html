<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8f8">
    <title>Log in | Smart Home Energy Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="page-shell account-page">
        <a class="wordmark" href="/html/index.html">Smart Home Energy Management System</a>
        <section class="account-content" aria-labelledby="login-title">
            <a class="back-link" href="/html/index.html">&larr; Home</a>
            <h1 id="login-title">Log in</h1>
            <p class="form-intro">Welcome back. Sign in to your account.</p>
            <form id="loginForm" class="account-form">
                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="Username" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" required>
                </div>
                <button class="action action-primary" type="button">Log in</button>
                <p id="loginError" class="form-message" aria-live="polite"></p>
            </form>
            <p class="account-switch">New here? <a href="/html/register.html">Create an account</a></p>
        </section>
    </main>
    <script src="/js/login.js" defer></script>
</body>
</html>
