<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8f8">
    <title>Create account | Smart Home Energy Management System</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/register.js" defer></script>
</head>
<body>
    <main class="page-shell account-page">
        <a class="wordmark" href="/html/index.html">Smart Home Energy Management System</a>
        <section class="account-content register-content" aria-labelledby="register-title">
            <a class="back-link" href="/html/index.html">&larr; Home</a>
            <h1 id="register-title">Create your account</h1>
            <p class="form-intro">Get started managing your smart home.</p>
            <form id="registerForm" class="account-form">
                <div class="form-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" maxlength="20" autocomplete="username" placeholder="Username" aria-describedby="usernameError" required>
                    <p class="field-message" id="usernameError" aria-live="polite"></p>
                </div>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="Email" aria-describedby="emailError" required>
                    <p class="field-message" id="emailError" aria-live="polite"></p>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Password" aria-describedby="passwordError" required>
                    <p class="field-message" id="passwordError" aria-live="polite"></p>
                </div>
                <div class="form-field">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Confirm password" aria-describedby="confirmPasswordError" required>
                    <p class="field-message" id="confirmPasswordError" aria-live="polite"></p>
                </div>
                <button class="action action-primary" type="submit">Create account</button>
                <p class="form-message" id="registerError" aria-live="polite"></p>
            </form>
            <p class="account-switch">Already have an account? <a href="/html/login.html">Log in</a></p>
        </section>
    </main>
</body>
</html>
